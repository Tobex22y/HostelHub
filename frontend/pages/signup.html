<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BOUESTI Portal - Sign Up</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="icon" href="../assets/images/bouestilogo.png" type="image/png" />
  </head>
  <body>
    <header>
      <div class="logo_container">
        <img src="../assets/images/bouestilogo.png" alt="" id="logo" />
        <p>HostelHub</p>
      </div>

      <div class="nav-links">
        <a href="login.html">Student Login</a>
        <a href="signup.html">Sign Up</a>
        <a href="admin-login.html">Admin Login</a>
      </div>
    </header>

    <section class="signup_section">
      <div class="main-wrapper">
        <div class="auth-card">
          <h1>Create Account</h1>
          <p class="subtitle">Join the residential community.</p>

          <form id="signupForm" enctype="multipart/form-data">
            <div class="form-group">
              <label>Full Name</label>
              <input
                id="full-name"
                type="text"
                placeholder="John Doe"
                required
              />
            </div>
            <div class="form-group">
              <label>Matric Number</label>
              <input
                id="matric-number"
                type="text"
                placeholder="CSC/2022/5151"
                required
              />
            </div>
            <div class="form-group">
              <label>Email</label>
              <input
                id="email"
                type="email"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input
                id="phone"
                type="tel"
                placeholder="08012345678"
                required
              />
            </div>
            <div class="form-group">
              <label class="label-name">Gender</label>
              <select id="signupGender" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label>Profile Picture</label>
              <input id="signupPicture" type="file" accept="image/*" required />
              <small style="color: var(--text-gray); font-size: 12px"
                >Upload a clear photo of yourself (JPG, PNG, max 2MB)</small
              >
            </div>
            <div class="form-group">
              <label>Password</label>
              <input id="signupPassword" type="password" required />
            </div>
            <div class="form-group">
              <label>Confirm Password</label>
              <input id="signupConfirm" type="password" required />
            </div>

            <button type="submit" class="btn-primary">Register Now</button>
          </form>

          <div class="footer-link">
            Already registered? <a href="login.html">Sign In</a>
          </div>
        </div>
      </div>
    </section>

   <script src="../assets/js/signup.js"></script>
  </body>
</html>
