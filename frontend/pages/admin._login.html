<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - HostelHub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }

    .login-card {
      background: #111827;
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .login-card h2 {
      text-align: center;
      margin-bottom: 5px;
    }

    .login-card p {
      text-align: center;
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
      color: #cbd5e1;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      outline: none;
      background: #1f2937;
      color: white;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .status {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
    }

    .error { color: #f87171; }
    .success { color: #34d399; }

    .footer {
      margin-top: 15px;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <h2>Admin Portal</h2>
    <p>Hostel Management System</p>

    <div class="input-group">
      <label>Email</label>
      <input type="email" id="adminEmail" placeholder="admin@hostel.com">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="adminPassword" placeholder="••••••••">
    </div>

    <button class="btn" id="adminLoginBtn">Login</button>

    <div class="status" id="adminStatus"></div>

    <div class="footer">
      © 2026 HostelHub Admin System
    </div>
  </div>

  <script src="../assets/js/admin_login.js"></script>
</body>
</html>
