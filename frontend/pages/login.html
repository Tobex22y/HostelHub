<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BOUESTI Portal - Login</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="icon" href="../assets/images/bouestilogo.png" type="image/png" />
  </head>
  <body>
    <header>
      <div class="logo_container">
        <img src="../assets/images/bouestilogo.png" alt="" id="logo" />
        <p>HostelHub</p>
      </div>

      <div class="nav-links">
        <a href="login.html">Student Login</a>
        <a href="signup.html">Sign Up</a>
        <a href="admin-login.html">Admin Login</a>
      </div>
    </header>

    <section>
      <div class="main-wrapper">
        <div class="auth-card">
          <h1>Welcome Back</h1>
          <p class="subtitle">
            Enter your matric number to access the hostel portal.
          </p>

          <form id="loginForm">
            <div class="form-group">
              <label>Matric Number</label>
              <input
                type="text"
                id="loginMatric"
                placeholder="BST/2023/XXXX"
                required
              />
              <label>Password</label>
              <input type="password" id="loginPassword" required />
            </div>

            <button type="submit" class="btn-primary">Log In &rarr;</button>
          </form>

          <div class="footer-link">
            New student? <a href="signup.html">Create an account</a>
          </div>
        </div>
      </div>
    </section>

    <script src="../assets/js/login.js"></script>
  </body>
</html>
