<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BOUESTI Portal - Login</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="icon" href="../assets/images/bouestilogo.png" type="image/png">
</head>
<body>

    <header>
      <div class="logo_container">
        <img src="../assets/images/bouestilogo.png" alt="" id="logo" />
        <p>HostelHub</p>
      </div>

      <div class="nav-links">
        <a href="login.html">Student Login</a>
        <a href="signup.html">Sign Up</a>
        <a href="admin-login.html">Admin Login</a>
      </div>
    </header>

    <section>

   
    <div class="main-wrapper">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p class="subtitle">Enter your matric number to access the hostel portal.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>Matric Number</label>
                    <input type="text" id="matric" placeholder="BST/2023/XXXX" required>
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                
                <button type="submit" class="btn-primary">Sign In &rarr;</button>
            </form>

            <div class="footer-link">
                New student? <a href="signup.html">Create an account</a>
            </div>
        </div>
    </div>
     </section>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const matricVal = document.getElementById('matric').value.trim();
            const passwordVal = document.getElementById('password').value;

            if (!matricVal || !passwordVal) {
                alert('Please enter your matric number and password.');
                return;
            }

            try {
                const response = await fetch('../api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    credentials: 'include',
                    body: new URLSearchParams({ identifier: matricVal, password: passwordVal })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    alert(result.message || 'Invalid matric number or password.');
                    return;
                }

                // Store student data for dashboard use
                if (result.data) {
                    localStorage.setItem('student_data', JSON.stringify(result.data));
                }

                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error(error);
                alert('Login failed. Please try again later.');
            }
        });
    </script>
</body>
</html>
