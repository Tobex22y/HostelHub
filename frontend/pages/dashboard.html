<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Dashboard | HostelHub</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f4f6;
        display: flex;
      }

      /* Sidebar */
      .sidebar {
        width: 240px;
        height: 100vh;
        background: #111827;
        color: white;
        position: fixed;
        left: 0;
        top: 0;
        padding: 25px 15px;
      }

      .logo {
        text-align: center;
        margin-bottom: 30px;
      }

      .logo h2 {
        color: #3b82f6;
      }

      .nav-link {
        display: block;
        padding: 12px 15px;
        margin-bottom: 8px;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        transition: 0.3s;
      }

      .nav-link:hover,
      .nav-link.active {
        background: #2563eb;
      }

      /* Main */
      .main {
        margin-left: 240px;
        width: calc(100% - 240px);
        padding: 25px;
      }

      /* Topbar */
      .topbar {
        background: white;
        border-radius: 12px;
        padding: 15px 20px;

        display: flex;
        justify-content: space-between;
        align-items: center;

        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
      }

      .logout-btn {
        background: #dc2626;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
      }

      .logout-btn:hover {
        background: #b91c1c;
      }

      /* Stats */
      .stats-grid {
        margin-top: 20px;

        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
      }

      .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
      }

      .card h3 {
        color: #374151;
        margin-bottom: 10px;
      }

      .card p {
        font-size: 24px;
        font-weight: bold;
        color: #2563eb;
      }

      /* Dashboard layout */

      .dashboard-grid {
        margin-top: 20px;

        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
      }

      /* Sections */

      .section,
      .side-panel {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
      }

      .section h2,
      .side-panel h2 {
        margin-bottom: 15px;
      }

      /* Room cards */

      .room-card {
        background: #f9fafb;
        border-left: 5px solid #2563eb;

        padding: 15px;
        border-radius: 10px;
        margin-bottom: 15px;
      }

      .room-card h3 {
        margin-bottom: 10px;
      }

      .room-info {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 10px 0;
      }

      .badge {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
      }

      .available {
        background: #dcfce7;
        color: #166534;
      }

      .occupied {
        background: #fee2e2;
        color: #991b1b;
      }

      /* Buttons */

      .action-btn {
        width: 100%;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        border: none;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
      }

      .action-btn:hover {
        opacity: 0.9;
      }

      /* Allocation */

      .allocation-card {
        background: linear-gradient(135deg, #2563eb, #1e40af);

        color: white;
        border-radius: 12px;
        padding: 15px;
      }

      .allocation-item {
        background: rgba(255, 255, 255, 0.15);
        margin-top: 10px;
        padding: 10px;
        border-radius: 8px;

        display: flex;
        justify-content: space-between;
      }

      .empty-state {
        text-align: center;
        color: #6b7280;
        padding: 20px;
      }

      /* Modal */

      .modal {
        display: none;

        position: fixed;
        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        background: rgba(0, 0, 0, 0.5);

        justify-content: center;
        align-items: center;
      }

      .modal-content {
        background: white;
        width: 450px;
        max-height: 80vh;
        overflow: auto;

        padding: 20px;
        border-radius: 12px;
      }

      .close {
        float: right;
        font-size: 25px;
        cursor: pointer;
      }

      /* Mobile */

      @media (max-width: 768px) {
        .sidebar {
          width: 70px;
        }

        .logo h2 {
          font-size: 18px;
        }

        .nav-link {
          font-size: 12px;
          text-align: center;
          padding: 10px 5px;
        }

        .main {
          margin-left: 70px;
          width: calc(100% - 70px);
        }

        .dashboard-grid {
          grid-template-columns: 1fr;
        }

        .modal-content {
          width: 90%;
        }
      }

      .pay-btn {
        margin-top: 15px;
        width: 100%;
        background: #2563eb;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
      }

      .pay-btn:hover {
        background: #1e40af;
      }

      .paid-badge {
        margin-top: 10px;
        padding: 10px;
        background: #dcfce7;
        color: #166534;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo">
        <h2>HostelHub</h2>
      </div>

      <a class="nav-link active" href="#"> 🏠 Dashboard </a>

      <a class="nav-link" href="#"> 🛏 Rooms </a>

      <a class="nav-link" href="#"> 📌 Allocation </a>

      <a class="nav-link" href="#"> 💳 Payments </a>

      <a class="nav-link" href="#"> 👤 Profile </a>
    </div>

    <!-- Main -->
    <div class="main">
      <!-- Topbar -->
      <div class="topbar">
        <h3>Welcome Student 👋</h3>

        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <!-- Stats -->

      <div class="stats-grid">
        <div class="card">
          <h3>Room Status</h3>

          <p id="roomStatus">Loading...</p>
        </div>

        <div class="card">
          <h3>Payment</h3>

          <p id="paymentStatus">Loading...</p>
        </div>

        <div class="card">
          <h3>Hostel Block</h3>

          <p id="hostelBlock">--</p>
        </div>

        <div class="card">
          <h3>Bed Number</h3>

          <p id="bedNumber">--</p>
        </div>
      </div>

      <!-- Main grid -->

      <div class="dashboard-grid">
        <!-- Rooms -->

        <div class="section">
          <h2>Available Rooms</h2>

          <div id="roomsContainer">Loading rooms...</div>
        </div>

        <!-- Allocation -->

        <div class="side-panel">
          <h2>My Allocation</h2>

          <div id="allocationBox">Loading...</div>
        </div>
      </div>
    </div>

    <!-- Room Modal -->

    <div id="roomModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()"> &times; </span>

        <h2 id="modalTitle">Room</h2>

        <div id="modalBeds">Loading beds...</div>
      </div>
    </div>

    <script src="../assets/js/app.js"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
  </body>
</html>
