<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bed Reservation Test</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f6fa;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .room-list, .bed-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .occupied {
      background: #ffdddd;
      cursor: not-allowed;
    }

    .available {
      background: #ddffe0;
    }

    button {
      margin-top: 10px;
      padding: 8px 12px;
      border: none;
      background: #2f80ed;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:disabled {
      background: gray;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>🏠 Select Room</h2>
  <div id="rooms" class="room-list"></div>

  <h2>🛏️ Select Bed</h2>
  <div id="beds" class="bed-list"></div>

  <p id="msg"></p>
</div>

<script src="../assets/js/reserve.js"></script>

</body>
</html>
