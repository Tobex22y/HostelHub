<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - HostelHub</title>

  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <h2>HostelHub</h2>
      <p>Admin Panel</p>
    </div>

    <nav>
      <a href="#" class="active">Dashboard</a>
      <a href="#">Rooms</a>
      <a href="#">Students</a>
      <a href="#">Payments</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <header class="topbar">
      <h1>Dashboard Overview</h1>
      <p>Manage rooms, students and payments</p>
    </header>

    <!-- STATS -->
    <section class="stats">

      <div class="card">
        <h3>Total Rooms</h3>
        <p id="totalRooms">0</p>
      </div>

      <div class="card">
        <h3>Total Beds</h3>
        <p id="totalBeds">0</p>
      </div>

      <div class="card">
        <h3>Occupied Beds</h3>
        <p id="occupiedBeds">0</p>
      </div>

      <div class="card">
        <h3>Available Beds</h3>
        <p id="availableBeds">0</p>
      </div>

    </section>

    <!-- CREATE ROOM -->
    <section class="panel">

      <h2>Create New Room</h2>

      <div class="form-grid">
        <input id="roomNumber" placeholder="Room Number">
        <input id="roomType" placeholder="Room Type">
        <input id="capacity" type="number" placeholder="Bed Capacity">
        <input id="price" type="number" placeholder="Price">

        <button onclick="createRoom()">Create Room</button>
      </div>

    </section>

    <div id="requests"></div>

    <div class="panel danger">
  <h2>Danger Zone</h2>
  <button onclick="resetDB()">Reset Entire System</button>
</div>

  </main>

</div>

<script src="../assets/js/admin.js"></script>

</body>
</html>
